name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  SERVER_VERSION: v0.5.1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download server
        run: |
          name="anway-${SERVER_VERSION}-linux-amd64"

          curl -fsSL "https://github.com/thadeu/anway/releases/download/${SERVER_VERSION}/${name}.tar.gz" | tar xz
          echo "SERVER_BIN=$PWD/$name/anway" >> "$GITHUB_ENV"

      - name: Test
        run: go test -race ./...
